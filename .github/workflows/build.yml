name: Run Test Case

on: [push]

jobs:
  build:

    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        # The launcher and the tests run on .NET 6 (<TargetFramework> in CSharp.lua.Launcher/CSharp.lua.Launcher.csproj);
        # the newest SDK builds them.
        dotnet-version: |
          6.0.x
          10.0.x
    - name: clear
      run: dotnet clean --configuration Debug && dotnet nuget locals all --clear
    - name: Build with dotnet
      run: dotnet build --configuration Debug
    - name: Run Test Case
      run: cd test/ & test
      shell: cmd
